services:
    zookeeper:
        image: confluentinc/cp-zookeeper:7.5.0
        container_name: zookeeper
        environment:
            ZOOKEEPER_CLIENT_PORT: 2181
            ZOOKEEPER_TICK_TIME: 2000
        ports:
            - '2181:2181'
        healthcheck:
            test: ['CMD', 'nc', '-z', 'localhost', '2181']
            interval: 10s
            timeout: 5s
            retries: 5

    kafka:
        image: confluentinc/cp-kafka:7.5.0
        container_name: kafka
        depends_on:
            zookeeper:
                condition: service_healthy
        environment:
            KAFKA_BROKER_ID: 1
            KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
            KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092
            KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
            KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
        ports:
            - '9092:9092'
        healthcheck:
            test:
                [
                    'CMD',
                    'kafka-topics',
                    '--bootstrap-server',
                    'localhost:9092',
                    '--list',
                ]
            interval: 10s
            timeout: 10s
            retries: 5
            start_period: 30s

    kafka-connect:
        image: debezium/connect:2.2
        platform: linux/amd64
        container_name: kafka-connect
        depends_on:
            - kafka
        environment:
            BOOTSTRAP_SERVERS: kafka:9092
            GROUP_ID: 'connect-cluster'
            CONFIG_STORAGE_TOPIC: 'connect-configs'
            OFFSET_STORAGE_TOPIC: 'connect-offsets'
            STATUS_STORAGE_TOPIC: 'connect-status'
            CONNECT_KEY_CONVERTER_SCHEMAS_ENABLE: 'false'
            CONNECT_VALUE_CONVERTER_SCHEMAS_ENABLE: 'false'
            CONNECT_KEY_CONVERTER: 'org.apache.kafka.connect.json.JsonConverter'
            CONNECT_VALUE_CONVERTER: 'org.apache.kafka.connect.json.JsonConverter'
            CONNECT_INTERNAL_KEY_CONVERTER: 'org.apache.kafka.connect.json.JsonConverter'
            CONNECT_INTERNAL_VALUE_CONVERTER: 'org.apache.kafka.connect.json.JsonConverter'
            CONNECT_REST_ADVERTISED_HOST_NAME: kafka-connect
            CONNECT_PLUGIN_PATH: /kafka/connect
        ports:
            - '8083:8083'

    postgres-api:
        image: postgres:16-alpine
        container_name: postgres-api
        environment:
            POSTGRES_USER: maxramirez
            POSTGRES_PASSWORD: 22leorexx100
            POSTGRES_DB: nutritional_advice
        command: >
            postgres -c wal_level=logical
                     -c max_replication_slots=5
                     -c max_wal_senders=5
                     -c listen_addresses='*'
        ports:
            - '5433:5432'
        volumes:
            - pgdata_api:/var/lib/postgresql/data

    postgres-nutritional:
        image: postgres:16-alpine
        container_name: postgres-nutritional
        environment:
            POSTGRES_USER: maxramirez
            POSTGRES_PASSWORD: 22leorexx100
            POSTGRES_DB: nutritional_advice
        command: >
            postgres -c wal_level=logical
                     -c max_replication_slots=5
                     -c max_wal_senders=5
                     -c listen_addresses='*'
        ports:
            - '5432:5432'
        volumes:
            - pgdata_nutritional:/var/lib/postgresql/data

    postgres-auth:
        image: postgres:16-alpine
        container_name: postgres-auth
        environment:
            POSTGRES_USER: maxramirez
            POSTGRES_PASSWORD: 22leorexx100
            POSTGRES_DB: auth_service
        command: >
            postgres -c wal_level=logical
                     -c max_replication_slots=5
                     -c max_wal_senders=5
                     -c listen_addresses='*'
        ports:
            - '5434:5432'
        volumes:
            - pgdata_auth:/var/lib/postgresql/data

    api-gateway:
        build:
            context: ./api-gateway-nur-grupo1
            cache_from:
                - api-gateway:latest
        container_name: api-gateway
        environment:
            - KAFKA_BROKER=kafka:9092
            - DATABASE_HOST=postgres-api
            - DATABASE_PORT=5432
            - DATABASE_USER=maxramirez
            - DATABASE_PASSWORD=22leorexx100
            - DATABASE_NAME=nutritional_advice
        ports:
            - '4000:4000'
        depends_on:
            kafka:
                condition: service_healthy
            postgres-api:
                condition: service_started
        healthcheck:
            test:
                [
                    'CMD',
                    'wget',
                    '--spider',
                    '-q',
                    'http://localhost:4000/health',
                ]
            interval: 10s
            timeout: 5s
            retries: 5
            start_period: 20s

    nutritional-advice:
        image: maxlyonel22/nutritional-advice:latest
        container_name: nutritional-advice
        env_file:
            - .env
        ports:
            - '3000:3000'
        depends_on:
            - kafka
            - postgres-nutritional
        restart: unless-stopped

    auth-service:
        image: maxlyonel22/auth-service:latest
        container_name: auth-service
        env_file:
            - .env
        ports:
            - '3001:3000'
        depends_on:
            - postgres-auth
        restart: unless-stopped

volumes:
    pgdata_api:
    pgdata_nutritional:
