name: CI

on:
    push:
        branches: [main]
    pull_request:
        branches: [main]

jobs:
    lint-and-test:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout code
              uses: actions/checkout@v4
              with:
                  fetch-depth: 0

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: '20'
                  cache: 'npm'

            - name: Install dependencies
              run: npm ci --ignore-scripts

            - name: Run ESLint
              run: npm run lint

            - name: Run tests and generate coverage
              run: npx jest --config=jest.config.js --coverage --testPathIgnorePatterns="integration|e2e|pact" --coverageReporters=html --coverageReporters=text --coverageReporters=lcov --coverageReporters=clover

            - name: Upload coverage HTML report
              uses: actions/upload-artifact@v4
              with:
                  name: coverage-html-report
                  path: coverage/lcov-report/
                  retention-days: 30

            - name: Upload lcov.info
              uses: actions/upload-artifact@v4
              with:
                  name: coverage-lcov
                  path: coverage/lcov.info
                  retention-days: 7

            - name: Build project
              run: npm run build

            - name: SonarCloud Scan
              uses: sonarsource/sonarcloud-github-action@v2.0.0
              with:
                  projectBaseDir: .
                  args: >
                      -Dsonar.organization=asesoramiento-nutricional
                      -Dsonar.projectKey=MaxLyonel_asesoramiento-nutricional
                      -Dsonar.javascript.lcov.reportPaths=coverage/lcov.info
              env:
                  SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
