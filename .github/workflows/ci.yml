name: CI

on:
    push:
        branches: [main]
    pull_request:
        branches: [main]

jobs:
    lint-and-test:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: '20'
                  cache: 'npm'

            - name: Install dependencies
              run: npm ci

            - name: Run ESLint
              run: npm run lint

            - name: Run tests with coverage
              run: npm run test:cov

            - name: Generate HTML coverage report
              run: npx jest --coverage --coverageReporters=html --coverageReporters=text --coverageReporters=lcov --coverageReporters=json --coverageReporters=clover --collectCoverageFrom="src/**/*.ts" --collectCoverageFrom="!src/**/*.spec.ts"

            - name: Upload coverage HTML report
              uses: actions/upload-artifact@v4
              with:
                  name: coverage-html-report
                  path: coverage/lcov-report/
                  retention-days: 30

            - name: Upload coverage lcov.info
              uses: actions/upload-artifact@v4
              with:
                  name: coverage-lcov
                  path: coverage/lcov.info
                  retention-days: 7

            - name: Build project
              run: npm run build
