name: CD

on:
    push:
        branches: [main]

jobs:
    build-and-push:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Login to Docker Hub
              uses: docker/login-action@v3
              with:
                  username: ${{ secrets.DOCKER_USERNAME }}
                  password: ${{ secrets.DOCKER_PASSWORD }}

            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@v3

            - name: Build and push nutritional-advice
              uses: docker/build-push-action@v5
              with:
                  context: .
                  file: ./dockerfile
                  push: true
                  tags: ${{ secrets.DOCKER_USERNAME }}/nutritional-advice:latest
                  cache-from: type=gha
                  cache-to: type=gha,mode=max

    deploy:
        needs: build-and-push
        runs-on: ubuntu-latest

        steps:
            - name: Deploy to server
              uses: appleboy/ssh-action@v1.0.3
              with:
                  host: ${{ secrets.SERVER_IP }}
                  username: ${{ secrets.SERVER_USER }}
                  key: ${{ secrets.SSH_PRIVATE_KEY }}
                  command_timeout: 30m
                  script: |
                      cd /root/app/nutritional-advice-microservice
                      git pull origin main
                      git clone https://github.com/NoeRous/api-gateway-nur-grupo1.git ./api-gateway-nur-grupo1 || (cd ./api-gateway-nur-grupo1 && git pull origin main)
                      docker compose down
                      docker compose pull nutritional-advice
                      docker compose up -d --build api-gateway
                      docker compose up -d nutritional-advice
