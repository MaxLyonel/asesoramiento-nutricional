name: CD

on:
    push:
        branches: [main]

jobs:
    deploy:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Deploy to server
              uses: appleboy/ssh-action@v1.0.3
              with:
                  host: ${{ secrets.SERVER_IP }}
                  username: ${{ secrets.SERVER_USER }}
                  key: ${{ secrets.SSH_PRIVATE_KEY }}
                  script: |
                      cd app/asesoramiento-nutricional
                      git pull origin main
                      docker build -t nutritional-advice:latest -f dockerfile .
                      docker stop nutritional-advice || true
                      docker rm nutritional-advice || true
                      docker run -d --name nutritional-advice -p 3000:3000 --env-file .env nutritional-advice:latest
