name: CD

on:
    push:
        branches: [main]

jobs:
    deploy:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Deploy to server
              uses: appleboy/ssh-action@v1.0.3
              with:
                  host: ${{ secrets.SERVER_IP }}
                  username: ${{ secrets.SERVER_USER }}
                  key: ${{ secrets.SSH_PRIVATE_KEY }}
                  script: |
                      cd /app/nutritional-advice-microservice
                      git pull origin main
                      git clone https://github.com/NoeRous/api-gateway-nur-grupo1.git ./api-gateway-nur-grupo1 || (cd ./api-gateway-nur-grupo1 && git pull origin main)
                      docker compose down
                      docker compose up -d --build
